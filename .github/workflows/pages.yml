name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit and integration tests with coverage
        run: pnpm test:coverage

      - name: Build production site
        run: pnpm build
        env:
          VITE_ENABLE_BEHAVIOUR_REFLECTION: 'false'

      - name: Validate GitHub Pages artifact
        run: pnpm validate:pages-artifact

      - name: Install Playwright browser
        # Temporarily disabled while the runner cannot resolve Ubuntu package mirrors.
        if: ${{ false }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright journeys against the disabled production build
        if: ${{ false }}
        run: pnpm test:e2e
        env:
          VITE_ENABLE_BEHAVIOUR_REFLECTION: 'false'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Build feature-enabled E2E site
        if: ${{ false }}
        run: pnpm build
        env:
          VITE_ENABLE_BEHAVIOUR_REFLECTION: 'true'

      - name: Run enabled Behaviour reflection E2E journey
        if: ${{ false }}
        run: pnpm exec playwright test tests/e2e/reflection.spec.ts
        env:
          VITE_ENABLE_BEHAVIOUR_REFLECTION: 'true'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
