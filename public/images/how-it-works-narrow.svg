<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Values move forward between rounds</title>
  <desc id="desc">A sample Round 1 shows three retained values and one in Not Important; Round 2 contains the retained values and a Next Round action.</desc>
  <rect width="960" height="600" rx="24" fill="#faf5f8"/>
  <rect x="26" y="26" width="908" height="548" rx="18" fill="#fff" stroke="#d6bdcc" stroke-width="2"/>
  <text x="58" y="80" fill="#613d60" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">EXAMPLE EXERCISE · TARGET: 2</text>
  <rect x="58" y="112" width="360" height="394" rx="14" fill="#fff" stroke="#d6bdcc" stroke-width="2"/>
  <text x="82" y="154" fill="#613d60" font-family="Arial,sans-serif" font-size="18" font-weight="700">ROUND 1</text>
  <text x="82" y="193" fill="#613d60" font-family="Arial,sans-serif" font-size="15" font-weight="700">KEEP IN THE NEXT ROUND</text>
  <g fill="#3c2a38" font-family="Arial,sans-serif" font-size="17">
    <rect x="82" y="210" width="310" height="48" rx="7" fill="#faf5f8" stroke="#d6bdcc"/><text x="100" y="241">Learning</text>
    <rect x="82" y="270" width="310" height="48" rx="7" fill="#faf5f8" stroke="#d6bdcc"/><text x="100" y="301">Independence</text>
    <rect x="82" y="330" width="310" height="48" rx="7" fill="#faf5f8" stroke="#d6bdcc"/><text x="100" y="361">Helping others</text>
  </g>
  <text x="82" y="415" fill="#613d60" font-family="Arial,sans-serif" font-size="15" font-weight="700">NOT IMPORTANT · REMOVED ON ADVANCE</text>
  <rect x="82" y="431" width="310" height="48" rx="7" fill="#efe0d8" stroke="#d6bdcc"/><text x="100" y="462" fill="#3c2a38" font-family="Arial,sans-serif" font-size="17">A sample value</text>
  <path d="M440 300h78m-18-18 18 18-18 18" fill="none" stroke="#613d60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="542" y="112" width="360" height="394" rx="14" fill="#fff" stroke="#d6bdcc" stroke-width="2"/>
  <text x="566" y="154" fill="#613d60" font-family="Arial,sans-serif" font-size="18" font-weight="700">ROUND 2</text>
  <text x="566" y="193" fill="#613d60" font-family="Arial,sans-serif" font-size="15" font-weight="700">REMAINING VALUES</text>
  <g fill="#3c2a38" font-family="Arial,sans-serif" font-size="17">
    <rect x="566" y="210" width="310" height="48" rx="7" fill="#faf5f8" stroke="#d6bdcc"/><text x="584" y="241">Learning</text>
    <rect x="566" y="270" width="310" height="48" rx="7" fill="#faf5f8" stroke="#d6bdcc"/><text x="584" y="301">Independence</text>
    <rect x="566" y="330" width="310" height="48" rx="7" fill="#faf5f8" stroke="#d6bdcc"/><text x="584" y="361">Helping others</text>
  </g>
  <rect x="566" y="418" width="310" height="58" rx="9" fill="#613d60"/>
  <text x="721" y="454" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Next Round</text>
</svg>
